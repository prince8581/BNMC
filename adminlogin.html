<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNM College : : Home</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="shortcut icon" href="./images/logo1.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
</head>

<body>
    <div class="container-fluid">
        <!--login start-->
        <div class="row my-5 rounded-5">

            <div class="col-sm-4 py-3 mx-auto shadow">
                <img src="./images/logo1.png" alt="" class=" admlogo">
                <p class="text-center ">Badri Narayan Mukteshwar College, Barhiya <br>
                    CAS (College ERP)</p>
                <form>
                    <div class="form-floating mb-3 mx-auto">

                        <input type="text" class="form-control" id="floatingInput" placeholder="name@example.com">
                        <label for="floatingInput">Username</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control py-2" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword">Password</label>
                    </div>

                    <input type="submit" value="Sign In" class="btn btn-primary form-control mt-3" />
                    <p class="text-center">Forget <a href="#">Password?</a></p>
                    <p class="text-center">Don’t have an account? <a href="register.html">Register Now</a></p>
                </form>
            </div>


        </div>
        <!--login end-->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
    <script src="./js/bootstrap.bundle.js"></script>
</body>

</html>
