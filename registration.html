<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNM College : : Home</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="shortcut icon" href="./images/logo1.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
</head>
<body>
    <div class="container-fluid">
        <!--registration start-->
        <div class="row mt-3 mb-5">
            <div class="col-sm-9  mx-auto border border-3 shadow py-3">
                <h1 class="text-center mt-2">Registration here....</h1>
                <div class="row">
                    <div class="col-sm-6">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" placeholder="Enter your First name" class="form-control" />
                    </div>
                    <div class="col-sm-6">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" placeholder="Enter your Last name" class="form-control" />
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-6">
                        <label for="fathername">Father's Name</label>
                        <input type="text" id="fathername" placeholder="Enter your Father's name"
                            class="form-control" />
                    </div>
                    <div class="col-sm-6">
                        <label for="mothername">Mother's Name</label>
                        <input type="text" id="mothername" placeholder="Enter your Mother's name"
                            class="form-control" />
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-12">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your Email" class="form-control" />
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-12">
                        <label for="mnumber">Phone Number</label>
                        <input type="number" id="mnumner" placeholder="Enter your Phone Number" class="form-control" />
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-6">
                        <label for="dob">Date Of Birth</label>
                        <input type="date" name="dob" id="dob" class="form-control">
                    </div>
                    <div class="col-sm-6">
                        <label for="inputState">State</label>
                        <select id="inputState" class="form-select">
                            <option selected>--Choose your state--</option>
                            <option>Bihar</option>
                            <option>Uttarpradesh</option>
                            <option>Chandigrah</option>
                            <option>Bhopal</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <label for="address">Address</label>
                        <textarea name="address" id="address" class="form-control"
                            placeholder="Enter the Address"></textarea>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-6">Select Gender :
                        <div class="form-check-inline">
                            <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios1"
                                value="option1">
                            <label class="form-check-label" for="gridRadios1">
                                Male
                            </label>
                        </div>
                        <div class="form-check-inline">
                            <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios2"
                                value="option2">
                            <label class="form-check-label" for="gridRadios2">
                                Female
                            </label>
                        </div>

                    </div>
                    <div class="col-sm-6">
                        <label for="age">Age</label>
                        <input type="text" id="age" placeholder="Enter your Age" class="form-control" />
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="gridCheck">
                            <label class="form-check-label" for="gridCheck">
                                I agree to the terms and conditions and acknowledge the privacy policy.
                            </label>
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-12">
                        <input type="submit" name="submit" id="submit" class="btn btn-primary">
                    </div>
                </div>


            </div>

        </div>
        <!--registration end-->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
    <script src="./js/bootstrap.bundle.js"></script>
</body>
</html>
